name: quality

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: ruff lint (report-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff
      # Report-only: --exit-zero never fails the build; findings show as GitHub
      # annotations. No auto-formatting or auto-fixing is performed.
      - name: Ruff lint (report-only)
        run: ruff check --output-format=github --exit-zero .

  coverage:
    name: pytest coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and test tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" numpy
      - name: Run tests with coverage
        run: pytest --cov=orbital_thermal --cov-report=term-missing --cov-report=xml --cov-fail-under=90
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error

  wheel-smoke:
    name: wheel build + clean-room smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist .
      - name: Install the wheel in a clean venv (no extras) and smoke-test
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --upgrade pip
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/python scripts/smoke_test.py

  examples:
    name: run examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package (numpy-only is enough for the examples)
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Run every example script
        run: |
          for ex in examples/*.py; do
            echo "::group::$ex"
            python "$ex" || exit 1
            echo "::endgroup::"
          done
